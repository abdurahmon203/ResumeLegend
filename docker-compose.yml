version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: resumelegend-db
    restart: always
    environment:
      POSTGRES_DB: resumelegend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: resumelegend_prod_pass_2026
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumelegend-backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:resumelegend_prod_pass_2026@db:5432/resumelegend
      - GITHUB_CALLBACK_URL=https://resumelegend.online/api/auth/github/callback
      - FRONTEND_URL=https://resumelegend.online
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://resumelegend.online
    container_name: resumelegend-frontend
    restart: always
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=https://resumelegend.online
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
